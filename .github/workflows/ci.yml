name: Node.js CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: set up node.js environment
        uses: actions/checkout@v4
      
      - name: checkout code
        uses: actions/setup-node@v4
        with: 
            node-version: 22
      
      - name: install dependencies
        run: npm ci

      - name: run tests
        run: npm test
  
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: deploy
        run: echo "deploying..."
